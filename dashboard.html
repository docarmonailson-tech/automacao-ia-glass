<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SHRUHH</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="logo-container">
      <div class="logo-icon"></div>
      <span class="brand-name">SHRUHH</span>
    </div>

    <nav class="sidebar-menu">
      <a href="#" class="menu-item active">📊 Painel</a>
      <a href="#" class="menu-item">🤖 Agentes IA</a>
      <a href="#" class="menu-item">💬 Conexões</a>
      <a href="#" class="menu-item">⚙️ Configurações</a>
    </nav>

    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <header class="header">
      <h2>Painel de Controle</h2>
      <span class="user-badge">Rahul</span>
    </header>

    <section class="cards-grid">
      <div class="glass-card status-card">
        <h3>WhatsApp</h3>
        <span class="status offline" id="wp-status">Desconectado</span>
        <button onclick="conectarWhatsapp()">Conectar QR Code</button>
      </div>

      <div class="glass-card status-card">
        <h3>Instagram / Meta</h3>
        <span class="status online">Conectado</span>
        <button disabled>Vinculado</button>
      </div>

      <div class="glass-card status-card">
        <h3>Agente de IA</h3>
        <span class="status online">Ativo (Gemini API)</span>
        <button onclick="configurarIA()">Configurar Prompt</button>
      </div>
    </section>

    <section class="glass-card logs-section">
      <h3>Últimas Automações</h3>
      <ul class="log-list" id="logList">
        <li><span>WhatsApp:</span> Resposta enviada para +55 11 99999-9999 (IA)</li>
        <li><span>Instagram:</span> Direct respondido automaticamente</li>
      </ul>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
